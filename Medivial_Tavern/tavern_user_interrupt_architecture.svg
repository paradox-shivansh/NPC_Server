<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker><style>.b{fill:#fff;stroke:#333;stroke-width:2}.t{font:700 22px Arial;fill:#222}.x{font:16px Arial;fill:#333}.s{font:14px Arial;fill:#555}.a{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke-dasharray:8 6}</style></defs>
